    <div style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: system-ui, sans-serif; color: #1a1a1a;">
      <h1>9M2PJU Coverage Prediction — Amateur Radio RF Coverage Map</h1>
      <p><strong>9M2PJU Coverage Prediction</strong> is a free terrain-aware RF coverage prediction tool for amateur radio operators. It supports VHF, UHF, and SHF planning from 30 MHz to 30 GHz.</p>
      <h2>Features</h2>
      <ul>
        <li>Multi-site terrain-aware RF coverage prediction with ITM Longley-Rice propagation modeling</li>
        <li>Hata and COST-231 empirical path loss models for suburban environments</li>
        <li>ITU-R P.838 rain attenuation and ITU-R P.676 gaseous atmospheric attenuation</li>
        <li>Deygout multi-obstruction knife-edge diffraction (ITU-R P.526)</li>
        <li>Fresnel zone clearance and HAAT (Height Above Average Terrain) analysis</li>
        <li>Supports FM voice, APRS/packet, SSB/weak-signal, and LoRa profiles</li>
        <li>Up to four transmitter sites with overlap-aware combined coverage</li>
        <li>Adjustable TX/RX antenna gain, system loss, receiver threshold, fade margin, and max range</li>
        <li>ITM reliability and confidence controls, clutter, two-ray, rain, and atmospheric settings</li>
        <li>Exports to GeoJSON, PDF, setup JSON, and shareable links</li>
        <li>Light and dark mode, mobile and desktop responsive</li>
      </ul>
      <h2>Supported Bands</h2>
      <p>10m (28 MHz), 6m (50 MHz), 2m (144 MHz), 1.25m (222 MHz), 70cm (430 MHz), 33cm (900 MHz), 23cm (1240 MHz), 13cm (2300 MHz), 9cm (3400 MHz), 5cm (5600 MHz), 3cm (10 GHz), 1.2cm (24 GHz)</p>
      <h2>Propagation Models</h2>
      <ul>
        <li><strong>NTIA ITM / Longley-Rice</strong> — Terrain-aware point-to-point model (authoritative when available)</li>
        <li><strong>Enhanced Hata</strong> — Okumura-Hata suburban with terrain penalty</li>
        <li><strong>COST-231 Hata</strong> — Extended Hata for 1.5-2 GHz</li>
        <li><strong>Free Space</strong> — ITU-R P.525 reference</li>
        <li><strong>ITM Hybrid</strong> — FSPL + terrain roughness + horizon loss</li>
      </ul>
      <p>This application requires JavaScript to run. Please enable JavaScript in your browser to use the coverage prediction map.</p>
      <p><a href="https://github.com/9M2PJU/9M2PJU-Amateur-Radio-Signals-Coverage-Map">View on GitHub</a></p>
